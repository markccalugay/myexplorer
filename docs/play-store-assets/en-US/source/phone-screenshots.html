<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyExplorer Play Store Phone Screenshots (1080x1920)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0b1d35;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .frame {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: linear-gradient(165deg, #0b1d35 0%, #0f2741 55%, #163452 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 84px 68px 0 68px;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 62%, rgba(30, 136, 229, 0.22) 0%, rgba(30, 136, 229, 0) 58%);
      pointer-events: none;
    }
    .copy {
      position: relative;
      z-index: 2;
      width: 100%;
      text-align: center;
      margin-bottom: 52px;
    }
    .kicker {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(30, 136, 229, 0.16);
      border: 1px solid rgba(74, 168, 255, 0.4);
      color: #7cc4ff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    h1 {
      color: #f7fbff;
      font-size: 62px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }
    .accent {
      color: #4aa8ff;
    }
    p.subtitle {
      color: #bfd3e5;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.38;
      max-width: 820px;
      margin: 0 auto;
    }
    .phone-wrap {
      position: relative;
      z-index: 2;
      width: 720px;
      padding: 18px;
      border-radius: 56px 56px 0 0;
      background: #1b2836;
      border: 3px solid rgba(124, 196, 255, 0.25);
      border-bottom: none;
      box-shadow: 0 -10px 60px rgba(4, 12, 24, 0.6);
    }
    .phone-screen {
      width: 100%;
      border-radius: 40px 40px 0 0;
      overflow: hidden;
      background: #ffffff;
    }
    .phone-screen img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="glow"></div>
    <div class="copy">
      <div class="kicker" id="kicker">Trip Planner</div>
      <h1 id="headline">Plan every stop in <span class="accent">one flow.</span></h1>
      <p class="subtitle" id="subtitle">Create a trip, name your route, and add destinations with coordinates.</p>
    </div>
    <div class="phone-wrap">
      <div class="phone-screen">
        <img id="shot" src="../originals/01-plan-trip-raw.png" alt="MyExplorer Android Screenshot" />
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slides = {
      "1": {
        kicker: "Trip Planner",
        headline: 'Plan your trip in <span class="accent">one place.</span>',
        subtitle: "Name your itinerary and add stops with addresses and coordinates.",
        img: "../originals/01-plan-trip-raw.png"
      },
      "2": {
        kicker: "Stop Order",
        headline: 'Order every stop <span class="accent">your way.</span>',
        subtitle: "Move stops up or down to set your Start, Stops, and Destination.",
        img: "../originals/02-stop-order-raw.png"
      },
      "3": {
        kicker: "Saved Trips",
        headline: 'Save and reopen <span class="accent">anytime.</span>',
        subtitle: "Keep itineraries stored on your device and pick up where you left off.",
        img: "../originals/03-saved-trips-raw.png"
      },
      "4": {
        kicker: "Appearance",
        headline: 'Built for <span class="accent">light and dark.</span>',
        subtitle: "Adapts automatically to your Android system theme.",
        img: "../originals/04-dark-mode-raw.png"
      }
    };
    const slide = slides[params.get("s") || "1"];
    if (slide) {
      document.getElementById("kicker").textContent = slide.kicker;
      document.getElementById("headline").innerHTML = slide.headline;
      document.getElementById("subtitle").textContent = slide.subtitle;
      document.getElementById("shot").src = slide.img;
    }
  </script>
</body>
</html>
